# Checks code quality and builds the app for every supported platform.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel outdated runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # The exact Flutter version is pinned in pubspec.yaml.
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: web
            os: ubuntu-latest
            command: flutter build web --release --wasm --no-web-resources-cdn
            artifact: build/web
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - target: ios
            os: macos-latest
            # No signing: produces an unsigned Runner.app for checking only.
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get
      - run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v7
        with:
          name: flutter-base-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
