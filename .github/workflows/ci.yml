# Checks and builds every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel outdated runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Signing secrets are not passed: CI builds are for checking only.
    uses: ./.github/workflows/build.yml
    with:
      version-label: dev
